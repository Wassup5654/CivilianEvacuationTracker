<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Evacuation lookup{% endblock %}</title>
  {% load static %}
  <script>
    /* Apply the saved theme before anything paints (dark "ops" by default). */
    (function () {
      var t = "ops";
      try { t = localStorage.getItem("evac-theme") || "ops"; } catch (e) {}
      document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "ops");
    })();
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.16.0/dist/leaflet-geoman.css">
  <link rel="stylesheet" href="{% static 'finder/site.css' %}?v=2">
  <link rel="stylesheet" href="{% static 'finder/theme-ops.css' %}?v=3">
  <link rel="manifest" href="{% url 'web_manifest' %}">
  <link rel="icon" href="{% static 'finder/icon.svg' %}" type="image/svg+xml">
  <meta name="theme-color" content="#1d4ed8">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <a class="brand" href="{% url 'home' %}">Evacuation lookup</a>
    <nav>
      <button type="button" class="linkish theme-toggle" id="theme-toggle" aria-pressed="false">Light mode</button>
      {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="linkish" type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
        <a href="{% url 'register' %}">Register</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.16.0/dist/leaflet-geoman.min.js"></script>
  <script src="{% static 'finder/theme.js' %}?v=1"></script>
  <script src="{% static 'finder/pwa.js' %}?v=1"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
